<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - NIET Event Management Portal</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<header>
  <nav class="navbar">
    <div class="logo-group">
      <img src="assets/logo.png" alt="NIET Logo" onerror="this.src='https://nehrucolleges.org/assets/favicon-256.png'">
      <div>
        <h1>NIET Event Management Portal</h1>
        <span>Nehru Institute of Engineering &amp; Technology</span>
      </div>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#about">About Us</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="admin-login.html" class="active">Admin</a></li>
      <li><a href="index.html#contact">Contact Us</a></li>
    </ul>
  </nav>
</header>

<div class="admin-login-wrap">
  <h2>Admin Login</h2>
  <form id="adminLoginForm">
    <div class="form-group">
      <label>Admin ID</label>
      <input type="text" id="adminId" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="adminPassword" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
    <div class="form-msg" id="loginMsg"></div>
  </form>
</div>

<footer id="footer-placeholder"></footer>

<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
